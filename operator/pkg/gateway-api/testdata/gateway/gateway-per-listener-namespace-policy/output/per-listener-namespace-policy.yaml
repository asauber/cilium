apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: per-listener-namespace-policy
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: cilium
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    name: permissive
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: Same
    name: same-only
    port: 8080
    protocol: HTTP
status:
  conditions:

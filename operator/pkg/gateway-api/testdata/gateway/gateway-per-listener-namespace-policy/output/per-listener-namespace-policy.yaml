    - lastTransitionTime: "2026-06-08T00:00:00Z"
      message: Resolved Refs
      observedGeneration: 0
      reason: ResolvedRefs
      status: "True"
      type: ResolvedRefs
    - lastTransitionTime: "2026-06-08T00:00:00Z"
      message: Listener Accepted
      observedGeneration: 0
      reason: Accepted
      status: "True"
      type: Accepted
    - lastTransitionTime: "2026-06-08T00:00:00Z"
      message: Address not ready yet
      reason: Pending
      status: "False"
      type: Programmed
    name: same-only
    supportedKinds:
    - group: gateway.networking.k8s.io

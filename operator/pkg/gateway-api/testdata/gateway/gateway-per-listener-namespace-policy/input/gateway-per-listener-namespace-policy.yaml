# This fixture pairs a single cross-namespace HTTPRoute with a Gateway whose
# two listeners admit disjoint namespace sets:
#   - listener "permissive"  (from: All)  must attach the route
#   - listener "same-only"   (from: Same) must NOT attach the route
# The expected CEC therefore contains a single, non-duplicated backend cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: per-listener-namespace-policy
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: cilium
  listeners:
    - name: permissive
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: same-only
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cross-namespace-route
  namespace: gateway-conformance-web-backend
spec:
  parentRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: per-listener-namespace-policy
      namespace: gateway-conformance-infra
  rules:
    - backendRefs:
        - name: web-backend
          port: 8080

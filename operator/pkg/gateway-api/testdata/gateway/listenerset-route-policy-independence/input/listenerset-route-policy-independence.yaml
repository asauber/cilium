apiVersion: v1
kind: Namespace
metadata:
  name: listenerset-route-policy
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: route-policy-independence
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: cilium
  allowedListeners:
    namespaces:
      from: All
  listeners:
  - name: gateway-http
    port: 8080
    protocol: HTTP
    # This policy must not restrict Routes attached to a ListenerSet.
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: delegated-listeners
  namespace: listenerset-route-policy
spec:
  parentRef:
    name: route-policy-independence
    namespace: gateway-conformance-infra
  listeners:
  - name: echo
    hostname: echo.example.com
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: listenerset-route-policy
spec:
  ports:
  - port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: listenerset-route-policy
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: ListenerSet
    name: delegated-listeners
    sectionName: echo
  hostnames:
  - echo.example.com
  rules:
  - backendRefs:
    - name: echo
      port: 8080
